<text x="916" y="558" font-size="15" font-weight="700" fill="#111827">Relationships</text>
<text x="916" y="584" font-size="13" fill="#111827" font-family="Menlo, monospace" xml:space="preserve">COURSE   1 : N  BATCH</text>
<text x="1160" y="584" font-size="13" fill="#4b5563">a course runs as many batches</text>
<text x="916" y="606" font-size="13" fill="#111827" font-family="Menlo, monospace" xml:space="preserve">TRAINER  1 : N  BATCH</text>
<text x="1160" y="606" font-size="13" fill="#4b5563">a trainer teaches many batches</text>
<text x="916" y="628" font-size="13" fill="#111827" font-family="Menlo, monospace" xml:space="preserve">BATCH    1 : N  ENROLMENT</text>
<text x="1160" y="628" font-size="13" fill="#4b5563">a batch has many enrolments</text>
<text x="916" y="650" font-size="13" fill="#111827" font-family="Menlo, monospace" xml:space="preserve">STUDENT  1 : N  ENROLMENT</text>
<text x="1160" y="650" font-size="13" fill="#4b5563">a student can enrol in many batches</text>
<text x="916" y="672" font-size="13" fill="#111827" font-family="Menlo, monospace" xml:space="preserve">BATCH    M : N  STUDENT</text>
<text x="1160" y="672" font-size="13" fill="#4b5563">resolved through ENROLMENT</text>
