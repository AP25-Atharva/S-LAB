spring.application.name=training-institute-api
server.port=${PORT:8080}

# Credentials come from env vars, or from the git-ignored application-local.properties
spring.config.import=optional:classpath:application-local.properties
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/training_institute?serverTimezone=Asia/Kolkata&allowPublicKeyRetrieval=true&useSSL=false}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

# Schema is managed by the SQL scripts in /database; Hibernate only checks the mapping
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=${SHOW_SQL:true}
spring.jpa.open-in-view=false
spring.jackson.serialization.write-dates-as-timestamps=false

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200}
